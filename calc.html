<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator</title>
  <!-- Rock-solid Cloudflare CDN bundle -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background-color: #1e1e1e;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: #fff;
    }
    .window {
      width: 320px;
      height: 480px;
      background: #2b2b2b;
      border-radius: 10px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.7);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    /* Calculator */
    #calc-view { display: flex; flex-direction: column; height: 100%; }
    #calc-display {
      flex: 1;
      background: #202020;
      color: #fff;
      font-size: 2.2rem;
      padding: 20px;
      text-align: right;
      display: flex;
      align-items: flex-end;
      justify-content: flex-end;
      word-break: break-all;
    }
    .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: #181818; }
    button.calc-btn {
      background: #3b3b3b;
      border: none;
      outline: none;
      color: #fff;
      font-size: 1.2rem;
      height: 65px;
      cursor: pointer;
    }
    button.calc-btn:hover { background: #484848; }
    button.calc-btn:active { background: #555555; }
    button.calc-btn.op { background: #303030; color: #ff9500; font-weight: bold; }
    button.calc-btn.action { background: #ff9500; color: #fff; font-weight: bold; }
    button.calc-btn.action:hover { background: #e08500; }

    /* Stealth Chat */
    #chat-view { display: none; flex-direction: column; height: 100%; background: #141414; }
    .chat-header {
      padding: 10px 14px;
      background: #202020;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
      border-bottom: 1px solid #333;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #e53935;
      display: inline-block;
      margin-right: 6px;
    }
    .status-dot.connected { background: #43a047; }
    .panic-btn { cursor: pointer; color: #888; font-size: 1.1rem; background: none; border: none; }
    .panic-btn:hover { color: #fff; }
    #chat-log {
      flex: 1;
      padding: 12px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      user-select: text;
    }
    .msg {
      max-width: 80%;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.82rem;
      line-height: 1.35;
      word-wrap: break-word;
    }
    .msg.me { background: #005c4b; align-self: flex-end; }
    .msg.peer { background: #262626; align-self: flex-start; border: 1px solid #383838; }
    .msg-bar { padding: 10px; background: #202020; display: flex; gap: 6px; }
    .msg-bar input {
      flex: 1;
      background: #111;
      border: 1px solid #3e3e3e;
      color: #fff;
      padding: 8px 10px;
      border-radius: 4px;
      font-size: 0.85rem;
      outline: none;
    }
    .msg-bar button {
      background: #1976d2;
      color: #fff;
      border: none;
      padding: 0 14px;
      border-radius: 4px;
      cursor: pointer;
    }
    .msg-bar button:disabled { background: #333; color: #666; cursor: not-allowed; }
  </style>
</head>
<body>

  <div class="window">
    <!-- Calculator Panel -->
    <div id="calc-view">
      <div id="calc-display">0</div>
      <div class="grid">
        <button class="calc-btn op" onclick="press('C')">C</button>
        <button class="calc-btn op" onclick="press('+/-')">±</button>
        <button class="calc-btn op" onclick="press('%')">%</button>
        <button class="calc-btn op" onclick="press('/')">÷</button>

        <button class="calc-btn" onclick="press('7')">7</button>
        <button class="calc-btn" onclick="press('8')">8</button>
        <button class="calc-btn" onclick="press('9')">9</button>
        <button class="calc-btn op" onclick="press('*')">×</button>

        <button class="calc-btn" onclick="press('4')">4</button>
        <button class="calc-btn" onclick="press('5')">5</button>
        <button class="calc-btn" onclick="press('6')">6</button>
        <button class="calc-btn op" onclick="press('-')">−</button>

        <button class="calc-btn" onclick="press('1')">1</button>
        <button class="calc-btn" onclick="press('2')">2</button>
        <button class="calc-btn" onclick="press('3')">3</button>
        <button class="calc-btn op" onclick="press('+')">+</button>

        <button class="calc-btn" style="grid-column: span 2;" onclick="press('0')">0</button>
        <button class="calc-btn" onclick="press('.')">.</button>
        <button class="calc-btn action" onclick="press('=')">=</button>
      </div>
    </div>

    <!-- Hidden Stealth Chat Panel -->
    <div id="chat-view">
      <div class="chat-header">
        <div><span id="status-dot" class="status-dot"></span><span id="status-text">Connecting...</span></div>
        <button class="panic-btn" title="Panic Lock (Esc)" onclick="triggerPanic()">✕</button>
      </div>

      <div id="chat-log"></div>

      <form class="msg-bar" id="chat-form" onsubmit="handleSend(event)">
        <input type="text" id="chat-input" placeholder="Waiting for peer..." autocomplete="off" disabled />
        <button type="submit" id="chat-send" disabled>Send</button>
      </form>
    </div>
  </div>

  <script>
    const SECRET_PIN = "7331";
    // Unique shared channel prefix
    const CHANNEL_KEY = "vault-chan-x992"; 

    let calcState = "0";
    let peer = null;
    let conn = null;
    let myId = "";
    let peerId = "";
    let connectInterval = null;

    // --- Calculator Engine ---
    function press(val) {
      const display = document.getElementById('calc-display');
      if (val === 'C') {
        calcState = "0";
      } else if (val === '=') {
        if (calcState === SECRET_PIN) {
          unlockAndConnect();
          calcState = "0";
          display.innerText = "0";
          return;
        }
        try {
          calcState = String(Function(`'use strict'; return (${calcState.replace(/×/g, '*').replace(/÷/g, '/')})`)());
        } catch {
          calcState = "Error";
        }
      } else if (val === '+/-') {
        calcState = calcState.startsWith('-') ? calcState.slice(1) : '-' + calcState;
      } else if (val === '%') {
        calcState = String(parseFloat(calcState) / 100);
      } else {
        calcState = (calcState === "0" || calcState === "Error") ? val : calcState + val;
      }
      display.innerText = calcState;
    }

    // --- Switch to Chat ---
    function unlockAndConnect() {
      document.getElementById('calc-view').style.display = 'none';
      document.getElementById('chat-view').style.display = 'flex';
      document.title = "calc";

      updateStatus(false, "Connecting to network...");

      // Generate deterministic 1 or 2 slots based on localStorage or mutual handshake
      initPeer();
    }

    function initPeer() {
      // Free public Google STUN configuration guarantees NAT hole-punching
      const config = {
        config: {
          iceServers: [
            { urls: 'stun:stun.l.google.com:19302' },
            { urls: 'stun:stun1.l.google.com:19302' }
          ]
        }
      };

      // Node A is primary; Node B is secondary
      const nodeA = CHANNEL_KEY + "-host";
      const nodeB = CHANNEL_KEY + "-guest";

      peer = new Peer(nodeA, config);

      peer.on('open', (id) => {
        myId = id;
        peerId = nodeB;
        updateStatus(false, "Waiting for peer...");
        listenForConnections();
      });

      peer.on('error', (err) => {
        if (err.type === 'unavailable-id') {
          // Host is taken -> Connect as Guest
          peer.destroy();
          peer = new Peer(nodeB, config);

          peer.on('open', (id) => {
            myId = id;
            peerId = nodeA;
            updateStatus(false, "Calling host...");
            listenForConnections();
            attemptDial(nodeA);
          });
        } else {
          console.error("PeerJS Error:", err);
          updateStatus(false, "Relay Error");
        }
      });
    }

    function attemptDial(targetId) {
      if (conn && conn.open) return;
      conn = peer.connect(targetId, { reliable: true });
      bindConnectionEvents(conn);

      // Retry dial every 3 seconds until host accepts
      if (!connectInterval) {
        connectInterval = setInterval(() => {
          if (!conn || !conn.open) {
            conn = peer.connect(targetId, { reliable: true });
            bindConnectionEvents(conn);
          } else {
            clearInterval(connectInterval);
            connectInterval = null;
          }
        }, 3000);
      }
    }

    function listenForConnections() {
      peer.on('connection', (incomingConn) => {
        if (conn && conn.open) return; // Keep existing session
        conn = incomingConn;
        bindConnectionEvents(conn);
      });
    }

    function bindConnectionEvents(c) {
      c.on('open', () => {
        if (connectInterval) {
          clearInterval(connectInterval);
          connectInterval = null;
        }
        updateStatus(true, "Peer Connected");
        const input = document.getElementById('chat-input');
        input.disabled = false;
        input.placeholder = "Type a message...";
        input.focus();
        document.getElementById('chat-send').disabled = false;
      });

      c.on('data', (data) => {
        appendMessage(data, 'peer');
      });

      c.on('close', () => {
        updateStatus(false, "Peer Disconnected");
        const input = document.getElementById('chat-input');
        input.disabled = true;
        input.placeholder = "Peer disconnected. Waiting...";
        document.getElementById('chat-send').disabled = true;
      });
    }

    // --- Panic Wipe ---
    function triggerPanic() {
      if (connectInterval) clearInterval(connectInterval);
      if (conn) {
        try { conn.close(); } catch(e) {}
        conn = null;
      }
      if (peer) {
        try { peer.destroy(); } catch(e) {}
        peer = null;
      }

      document.getElementById('chat-log').innerHTML = '';
      document.getElementById('chat-view').style.display = 'none';
      document.getElementById('calc-view').style.display = 'flex';
      
      const input = document.getElementById('chat-input');
      input.disabled = true;
      input.placeholder = "Waiting for peer...";
      document.getElementById('chat-send').disabled = true;
      
      updateStatus(false, "Disconnected");
      document.title = "Calculator";
    }

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') triggerPanic();
    });

    function handleSend(e) {
      e.preventDefault();
      const input = document.getElementById('chat-input');
      const text = input.value.trim();
      if (!text || !conn || !conn.open) return;

      conn.send(text);
      appendMessage(text, 'me');
      input.value = '';
    }

    function appendMessage(text, type) {
      const log = document.getElementById('chat-log');
      const msg = document.createElement('div');
      msg.className = `msg ${type}`;
      msg.innerText = text;
      log.appendChild(msg);
      log.scrollTop = log.scrollHeight;
    }

    function updateStatus(online, label) {
      document.getElementById('status-dot').className = `status-dot ${online ? 'connected' : ''}`;
      document.getElementById('status-text').innerText = label;
    }
  </script>
</body>
</html>
