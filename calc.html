<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Calculator</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background-color: #202124;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: #fff;
    }
    .window {
      width: 320px;
      height: 480px;
      background: #2b2b2b;
      border-radius: 8px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    /* Calculator View */
    #calc-view {
      display: flex;
      flex-direction: column;
      height: 100%;
    }
    #calc-display {
      flex: 1;
      background: #202020;
      color: #fff;
      font-size: 2.4rem;
      padding: 20px;
      text-align: right;
      overflow: hidden;
      display: flex;
      align-items: flex-end;
      justify-content: flex-end;
      word-break: break-all;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1px;
      background: #1e1e1e;
    }
    button.calc-btn {
      background: #3b3b3b;
      border: none;
      outline: none;
      color: #fff;
      font-size: 1.2rem;
      height: 65px;
      cursor: pointer;
      transition: background 0.1s;
    }
    button.calc-btn:hover { background: #484848; }
    button.calc-btn:active { background: #555555; }
    button.calc-btn.op { background: #333333; color: #ff9500; font-weight: bold; }
    button.calc-btn.action { background: #ff9500; color: #fff; font-weight: bold; }
    button.calc-btn.action:hover { background: #e08500; }

    /* Stealth Chat View */
    #chat-view {
      display: none;
      flex-direction: column;
      height: 100%;
      background: #181818;
    }
    .chat-header {
      padding: 10px 14px;
      background: #242424;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      border-bottom: 1px solid #333;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #e53935;
      display: inline-block;
      margin-right: 6px;
    }
    .status-dot.connected { background: #43a047; }
    .panic-btn {
      cursor: pointer;
      color: #888;
      font-size: 1.1rem;
      background: none;
      border: none;
    }
    .panic-btn:hover { color: #fff; }

    #chat-log {
      flex: 1;
      padding: 12px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      user-select: text;
    }
    .msg {
      max-width: 80%;
      padding: 7px 11px;
      border-radius: 6px;
      font-size: 0.82rem;
      line-height: 1.35;
      word-wrap: break-word;
    }
    .msg.me {
      background: #005c4b;
      align-self: flex-end;
    }
    .msg.peer {
      background: #2c2c2c;
      align-self: flex-start;
      border: 1px solid #3d3d3d;
    }
    .msg-bar {
      padding: 10px;
      background: #222;
      display: flex;
      gap: 6px;
    }
    .msg-bar input {
      flex: 1;
      background: #111;
      border: 1px solid #444;
      color: #fff;
      padding: 8px 10px;
      border-radius: 4px;
      font-size: 0.85rem;
      outline: none;
    }
    .msg-bar button {
      background: #1976d2;
      color: #fff;
      border: none;
      padding: 0 14px;
      border-radius: 4px;
      cursor: pointer;
    }
    .msg-bar button:disabled {
      background: #333;
      color: #777;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <div class="window">
    <!-- Functional Calculator -->
    <div id="calc-view">
      <div id="calc-display">0</div>
      <div class="grid">
        <button class="calc-btn op" onclick="press('C')">C</button>
        <button class="calc-btn op" onclick="press('+/-')">±</button>
        <button class="calc-btn op" onclick="press('%')">%</button>
        <button class="calc-btn op" onclick="press('/')">÷</button>

        <button class="calc-btn" onclick="press('7')">7</button>
        <button class="calc-btn" onclick="press('8')">8</button>
        <button class="calc-btn" onclick="press('9')">9</button>
        <button class="calc-btn op" onclick="press('*')">×</button>

        <button class="calc-btn" onclick="press('4')">4</button>
        <button class="calc-btn" onclick="press('5')">5</button>
        <button class="calc-btn" onclick="press('6')">6</button>
        <button class="calc-btn op" onclick="press('-')">−</button>

        <button class="calc-btn" onclick="press('1')">1</button>
        <button class="calc-btn" onclick="press('2')">2</button>
        <button class="calc-btn" onclick="press('3')">3</button>
        <button class="calc-btn op" onclick="press('+')">+</button>

        <button class="calc-btn" style="grid-column: span 2;" onclick="press('0')">0</button>
        <button class="calc-btn" onclick="press('.')">.</button>
        <button class="calc-btn action" onclick="press('=')">=</button>
      </div>
    </div>

    <!-- Direct Stealth Chat -->
    <div id="chat-view">
      <div class="chat-header">
        <div><span id="status-dot" class="status-dot"></span><span id="status-text">Searching for peer...</span></div>
        <button class="panic-btn" title="Panic Lock (Esc)" onclick="triggerPanic()">✕</button>
      </div>

      <div id="chat-log"></div>

      <form class="msg-bar" id="chat-form" onsubmit="handleSend(event)">
        <input type="text" id="chat-input" placeholder="Connecting..." autocomplete="off" disabled />
        <button type="submit" id="chat-send" disabled>Send</button>
      </form>
    </div>
  </div>

  <script type="module">
    // Using Trystero MQTT strategy over standard WSS ports (reliable on GitHub Pages)
    import { joinRoom } from 'https://cdn.jsdelivr.net/npm/trystero@0.25.3/mqtt/+esm';

    // --- HARDCODED CONFIGURATION ---
    const SECRET_PIN = "7331";
    const HARDCODED_ROOM = "alpha-kilo-9842";
    const HARDCODED_PASS = "v7$9Xp!mQ2#zL0wR";

    let calcState = "0";
    let activeRoom = null;
    let sendMessageAction = null;

    // --- Calculator Engine ---
    window.press = function(val) {
      const display = document.getElementById('calc-display');

      if (val === 'C') {
        calcState = "0";
      } else if (val === '=') {
        if (calcState === SECRET_PIN) {
          unlockAndConnect();
          calcState = "0";
          display.innerText = "0";
          return;
        }
        try {
          calcState = String(Function(`'use strict'; return (${calcState.replace(/×/g, '*').replace(/÷/g, '/')})`)());
        } catch {
          calcState = "Error";
        }
      } else if (val === '+/-') {
        calcState = calcState.startsWith('-') ? calcState.slice(1) : '-' + calcState;
      } else if (val === '%') {
        calcState = String(parseFloat(calcState) / 100);
      } else {
        if (calcState === "0" || calcState === "Error") {
          calcState = val;
        } else {
          calcState += val;
        }
      }
      display.innerText = calcState;
    };

    // --- Switch to Chat & Auto-Connect ---
    function unlockAndConnect() {
      document.getElementById('calc-view').style.display = 'none';
      document.getElementById('chat-view').style.display = 'flex';
      document.title = "calc";

      updateStatus(false, "Connecting to network...");

      const config = { 
        appId: 'calc_gh_pages_p2p',
        password: HARDCODED_PASS,
        // High-availability public WSS MQTT brokers that work over HTTPS
        brokerUrls: [
          'wss://public.mqtthq.com:8084/mqtt',
          'wss://test.mosquitto.org:8081'
        ]
      };

      try {
        activeRoom = joinRoom(config, HARDCODED_ROOM);

        const [send, receive] = activeRoom.makeAction('chat');
        sendMessageAction = send;

        activeRoom.onPeerJoin(peerId => {
          updateStatus(true, "Peer Connected");
          const input = document.getElementById('chat-input');
          input.disabled = false;
          input.placeholder = "Type a message...";
          input.focus();
          document.getElementById('chat-send').disabled = false;
        });

        activeRoom.onPeerLeave(peerId => {
          updateStatus(false, "Peer Disconnected");
          const input = document.getElementById('chat-input');
          input.disabled = true;
          input.placeholder = "Peer left. Waiting...";
          document.getElementById('chat-send').disabled = true;
        });

        receive((text) => {
          appendMessage(text, 'peer');
        });
      } catch (err) {
        console.error("Connection failed:", err);
        updateStatus(false, "Connection error");
      }
    }

    // --- Panic Lock ---
    window.triggerPanic = function() {
      if (activeRoom) {
        activeRoom.leave();
        activeRoom = null;
      }
      document.getElementById('chat-log').innerHTML = '';
      document.getElementById('chat-view').style.display = 'none';
      document.getElementById('calc-view').style.display = 'flex';
      
      const input = document.getElementById('chat-input');
      input.disabled = true;
      input.placeholder = "Connecting...";
      document.getElementById('chat-send').disabled = true;
      
      updateStatus(false, "Disconnected");
      document.title = "Calculator";
    };

    // ESC panic trigger
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        window.triggerPanic();
      }
    });

    window.handleSend = function(e) {
      e.preventDefault();
      const input = document.getElementById('chat-input');
      const text = input.value.trim();
      if (!text || !sendMessageAction) return;

      sendMessageAction(text);
      appendMessage(text, 'me');
      input.value = '';
    };

    function appendMessage(text, type) {
      const log = document.getElementById('chat-log');
      const msg = document.createElement('div');
      msg.className = `msg ${type}`;
      msg.innerText = text;
      log.appendChild(msg);
      log.scrollTop = log.scrollHeight;
    }

    function updateStatus(online, label) {
      const dot = document.getElementById('status-dot');
      const text = document.getElementById('status-text');
      dot.className = `status-dot ${online ? 'connected' : ''}`;
      text.innerText = label;
    }
  </script>
</body>
</html>
